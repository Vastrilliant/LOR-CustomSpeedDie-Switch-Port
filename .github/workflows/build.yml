name: build-plugin
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build make python3 python3-pip
          pip3 install --break-system-packages keystone-engine lz4 || pip3 install keystone-engine lz4
      - name: Fetch exlaunch
        run: |
          git clone --depth 1 https://github.com/shadowninja108/exlaunch.git
          TARGET=$(find exlaunch -path '*program/main.cpp' | head -n1)
          test -n "$TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          grep -rIl "PROGRAM_ID" exlaunch --exclude-dir=.git | head -20 | xargs -r sed -i -E 's/(PROGRAM_ID[ :=]+"?)0x[0-9A-Fa-f]+/\10x0100E7A019246000/'
      - name: Build variants
        run: |
          set -x
          ROOT=$(dirname "$(find exlaunch -name CMakeLists.txt -not -path '*/.git/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)")
          for V in empty svc; do
            cp "src/variants/$V.cpp" "$TARGET"
            find exlaunch -name 'subsdk*' -type f -delete
            rm -rf "$ROOT/build"
            ( cd "$ROOT"
              TC=$(find . -name 'toolchain*.cmake' | head -n1)
              cmake -S . -B build -G Ninja ${TC:+-DCMAKE_TOOLCHAIN_FILE=$TC}
              cmake --build build )
            mkdir -p "out/$V"
            find exlaunch -name 'subsdk9' -type f -exec cp -v {} "out/$V/subsdk9" \;
          done
          ls -laR out
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-variants
          path: out/**
